[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "r0ine-optimize"
version = "0.1.0"
description = "LLM token kullanimi azaltan kutuphane ve CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Kemal", email = "r0ine@outlook.com" }]
keywords = ["llm", "token-optimization", "prompt-caching", "context-pruning", "r0ine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
]

[project.scripts]
r0ine-optimize = "r0ine_optimize.cli:app"

[project.urls]
Homepage = "https://github.com/r0ine/r0ine-optimize"
Repository = "https://github.com/r0ine/r0ine-optimize"
Issues = "https://github.com/r0ine/r0ine-optimize/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/r0ine_optimize"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]